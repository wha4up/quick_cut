<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Quick Cut — player-side editing workflow</title>
  <desc id="desc">A video preview with a crop frame, an ordered sequence of clips, and a single-track timeline with an animated playhead leading to export.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101827"/>
      <stop offset="0.55" stop-color="#111f34"/>
      <stop offset="1" stop-color="#172640"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#25486a"/>
      <stop offset="0.55" stop-color="#397ca0"/>
      <stop offset="1" stop-color="#182b49"/>
    </linearGradient>
    <linearGradient id="activeClip" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3978e8"/>
      <stop offset="1" stop-color="#5b9cff"/>
    </linearGradient>
    <linearGradient id="exportFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#223e61"/>
      <stop offset="1" stop-color="#1d2f4a"/>
    </linearGradient>
    <clipPath id="screenClip"><rect x="48" y="36" width="442" height="132" rx="12"/></clipPath>
    <pattern id="microGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#6b87aa" stroke-opacity=".08" stroke-width="1"/>
    </pattern>
    <style>
      .playhead { animation: scan 5.4s cubic-bezier(.4,0,.2,1) infinite alternate; }
      @keyframes scan { from { transform: translateX(0); } to { transform: translateX(176px); } }
      @media (prefers-reduced-motion: reduce) { .playhead { animation: none; } }
    </style>
  </defs>

  <!-- Stable dark canvas keeps the artwork legible in both GitHub themes. -->
  <rect width="1200" height="300" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="22" fill="url(#microGrid)"/>
  <rect x="1" y="1" width="1198" height="298" rx="21" fill="none" stroke="#354763" stroke-opacity=".72"/>

  <!-- Player preview -->
  <rect x="38" y="26" width="462" height="152" rx="16" fill="#0a1321" stroke="#31435d" stroke-width="1.2"/>
  <g clip-path="url(#screenClip)">
    <rect x="48" y="36" width="442" height="132" fill="url(#screen)"/>
    <circle cx="397" cy="67" r="19" fill="#e7d6ad" opacity=".92"/>
    <path d="M48 135 L126 78 L188 125 L254 66 L342 133 L405 92 L490 137 V168 H48Z" fill="#28546b"/>
    <path d="M48 149 L123 112 L185 145 L271 103 L337 146 L414 115 L490 150 V168 H48Z" fill="#193b52"/>
    <path d="M48 157 Q118 143 181 155 T315 154 T490 149 V168 H48Z" fill="#102b40" opacity=".9"/>
    <path d="M48 49H490" stroke="#d8e9ff" stroke-opacity=".12"/>
    <path d="M48 157H490" stroke="#b2d5ed" stroke-opacity=".18"/>
    <!-- Crop frame and corner handles -->
    <rect x="125" y="53" width="255" height="91" rx="2" fill="#dbeafe" fill-opacity=".035" stroke="#e7f1ff" stroke-opacity=".82" stroke-width="1.4" stroke-dasharray="5 5"/>
    <path d="M125 69V53H141 M364 53H380V69 M125 128V144H141 M364 144H380V128" fill="none" stroke="#f3f8ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M252.5 53V144 M125 98.5H380" stroke="#e7f1ff" stroke-opacity=".18" stroke-width="1" stroke-dasharray="3 5"/>
  </g>
  <circle cx="62" cy="51" r="3" fill="#8ab8ff"/>
  <circle cx="73" cy="51" r="3" fill="#8ab8ff" opacity=".55"/>
  <circle cx="84" cy="51" r="3" fill="#8ab8ff" opacity=".3"/>

  <!-- Ordered clip sequence, deliberately shown as one lane rather than a multi-track editor. -->
  <g>
    <rect x="528" y="26" width="356" height="152" rx="16" fill="#111b2b" stroke="#31435d" stroke-width="1.2"/>
    <rect x="546" y="43" width="320" height="10" rx="5" fill="#26364d"/>
    <rect x="546" y="43" width="86" height="10" rx="5" fill="#54708f"/>
    <rect x="638" y="43" width="140" height="10" rx="5" fill="#4d90fa"/>
    <rect x="784" y="43" width="82" height="10" rx="5" fill="#54708f"/>
    <rect x="546" y="65" width="90" height="79" rx="8" fill="#253a52" stroke="#435a77"/>
    <rect x="643" y="65" width="140" height="79" rx="8" fill="#1b3455" stroke="#6fa8ff" stroke-width="1.5"/>
    <rect x="790" y="65" width="76" height="79" rx="8" fill="#253a52" stroke="#435a77"/>
    <!-- thumbnail-like image blocks -->
    <rect x="553" y="72" width="76" height="39" rx="4" fill="#315d7a"/>
    <path d="M553 104L571 85L586 101L601 81L629 105V111H553Z" fill="#507c8c"/>
    <path d="M553 107L574 96L589 108L612 94L629 108V111H553Z" fill="#1c415c"/>
    <rect x="650" y="72" width="126" height="39" rx="4" fill="url(#activeClip)"/>
    <path d="M650 105L671 85L693 101L714 79L737 101L756 88L776 105V111H650Z" fill="#8fc8f2" opacity=".66"/>
    <path d="M650 108L674 96L697 108L719 92L746 108L761 100L776 108V111H650Z" fill="#254e85" opacity=".86"/>
    <rect x="797" y="72" width="62" height="39" rx="4" fill="#315d7a"/>
    <path d="M797 105L814 86L828 101L844 87L859 104V111H797Z" fill="#5b899b"/>
    <rect x="553" y="120" width="48" height="5" rx="2.5" fill="#7086a1" opacity=".68"/>
    <rect x="553" y="130" width="63" height="4" rx="2" fill="#4d6480"/>
    <rect x="650" y="120" width="76" height="5" rx="2.5" fill="#8bb9ff"/>
    <rect x="650" y="130" width="108" height="4" rx="2" fill="#5279b2"/>
    <rect x="797" y="120" width="36" height="5" rx="2.5" fill="#7086a1" opacity=".68"/>
    <rect x="797" y="130" width="51" height="4" rx="2" fill="#4d6480"/>
    <path d="M635 61V149 M785 61V149" stroke="#101927" stroke-width="2"/>
  </g>

  <!-- Export destination -->
  <path d="M897 100H931 M922 91L931 100L922 109" fill="none" stroke="#79aaff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <g>
    <rect x="944" y="26" width="218" height="152" rx="16" fill="url(#exportFill)" stroke="#42628a" stroke-width="1.2"/>
    <path d="M1030 54H1072L1090 72V132Q1090 138 1084 138H1030Q1024 138 1024 132V60Q1024 54 1030 54Z" fill="#15243a" stroke="#8bb7f8" stroke-width="1.6"/>
    <path d="M1072 54V72H1090" fill="none" stroke="#8bb7f8" stroke-width="1.6" stroke-linejoin="round"/>
    <path d="M1057 117V87 M1045 99L1057 87L1069 99" fill="none" stroke="#83b4ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M1044 123H1070" stroke="#83b4ff" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="1057" cy="150" r="2.5" fill="#75dfce"/>
  </g>

  <!-- Single-lane timeline -->
  <rect x="38" y="190" width="1124" height="80" rx="15" fill="#0c1524" stroke="#31435d" stroke-width="1.2"/>
  <g stroke="#536983" stroke-opacity=".58" stroke-width="1">
    <path d="M83 201V210 M131 204V210 M179 201V210 M227 204V210 M275 201V210 M323 204V210 M371 201V210 M419 204V210 M467 201V210 M515 204V210 M563 201V210 M611 204V210 M659 201V210 M707 204V210 M755 201V210 M803 204V210 M851 201V210 M899 204V210 M947 201V210 M995 204V210 M1043 201V210 M1091 204V210"/>
  </g>
  <path d="M66 215H1135" stroke="#425773" stroke-width="1.2"/>

  <!-- Clip blocks: gaps and cut points are intentional. -->
  <g>
    <rect x="66" y="222" width="190" height="30" rx="6" fill="#2a405b" stroke="#49617d"/>
    <rect x="263" y="222" width="246" height="30" rx="6" fill="#2a405b" stroke="#49617d"/>
    <rect x="516" y="222" width="207" height="30" rx="6" fill="url(#activeClip)" stroke="#8cbaff" stroke-width="1.4"/>
    <rect x="730" y="222" width="142" height="30" rx="6" fill="#2a405b" stroke="#49617d"/>
    <rect x="879" y="222" width="234" height="30" rx="6" fill="#2a405b" stroke="#49617d"/>
    <g stroke="#9fb6d4" stroke-opacity=".45" stroke-width="1.2">
      <path d="M80 228V246 M95 228V246 M110 228V246 M125 228V246 M140 228V246 M155 228V246 M170 228V246 M185 228V246 M200 228V246 M215 228V246 M230 228V246"/>
      <path d="M278 228V246 M293 228V246 M308 228V246 M323 228V246 M338 228V246 M353 228V246 M368 228V246 M383 228V246 M398 228V246 M413 228V246 M428 228V246 M443 228V246 M458 228V246 M473 228V246 M488 228V246"/>
      <path d="M744 228V246 M759 228V246 M774 228V246 M789 228V246 M804 228V246 M819 228V246 M834 228V246 M849 228V246"/>
      <path d="M893 228V246 M908 228V246 M923 228V246 M938 228V246 M953 228V246 M968 228V246 M983 228V246 M998 228V246 M1013 228V246 M1028 228V246 M1043 228V246 M1058 228V246 M1073 228V246 M1088 228V246"/>
    </g>
    <g stroke="#a8ccff" stroke-opacity=".56" stroke-width="1.2">
      <path d="M531 228V246 M546 228V246 M561 228V246 M576 228V246 M591 228V246 M606 228V246 M621 228V246 M636 228V246 M651 228V246 M666 228V246 M681 228V246 M696 228V246"/>
    </g>
    <path d="M259 218V256 M512 218V256 M726 218V256 M875 218V256" stroke="#f5b96b" stroke-width="2.2" stroke-linecap="round" opacity=".94"/>
  </g>

  <!-- Gentle playhead sweep. The core artwork remains understandable when animation is disabled. -->
  <g class="playhead">
    <path d="M540 198V258" stroke="#eaf3ff" stroke-width="2" stroke-linecap="round"/>
    <path d="M540 199V258" stroke="#71a9ff" stroke-width="4" stroke-linecap="round" opacity=".22"/>
    <path d="M533 198L540 205L547 198Z" fill="#eef6ff"/>
    <circle cx="540" cy="258" r="3.5" fill="#79aaff" stroke="#d9e9ff" stroke-width="1"/>
  </g>
  <circle cx="1136" cy="245" r="3" fill="#75dfce" opacity=".8"/>
</svg>
