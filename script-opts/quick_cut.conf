# ============================================================
# quick_cut 推荐配置（版本号见 mpv 启动日志里的 quick_cut v… bootstrap 一行）
# 建议位置：portable_config/script-opts/quick_cut.conf
# 注释必须以 # 开头；不要加入任何 HTML 标签。
# 修改配置后建议重新启动 mpv。
# ============================================================

# FFmpeg 与输出
ffmpeg=ffmpeg
ffprobe=ffprobe
# 导出编码预设：original（原始参数＝跟随源文件：容器取源扩展名、视音频直接复制）、web、high、archive，
# 以及自定义的 u1、u2…；除 original 外整体覆盖编码相关选项，可在确认弹窗中继续循环切换。
export_preset=original

# 自定义编码预设（按 export_preset_list 顺序编号，编号从 1 开始）
# export_preset_list=NVENC 快速,H265 高画质
# export_preset_1_container=mp4
# export_preset_1_video_codec=h264_nvenc
# export_preset_1_preset=p4
# export_preset_1_quality_mode=cq
# export_preset_1_quality=20
# export_preset_1_audio_codec=aac
# export_preset_1_audio_bitrate=192k
# export_preset_1_pixel_format=yuv420p
# export_preset_1_faststart=yes
# export_preset_2_container=mkv
# export_preset_2_video_codec=libx265
# export_preset_2_quality_mode=crf
# export_preset_2_quality=20
# export_preset_2_extra_args=-x265-params log-level=error
# 填写 _args 表示完全自定义：脚本不再注入滤镜与编码参数，仅保留剪切、轨道映射与容器。
# 例：export_preset_3_args=-c:v av1_nvenc -cq 28 -c:a libopus -b:a 96k
export_preset_list=

# 全局附加 ffmpeg 参数：始终追加在脚本生成的参数之后、输出路径之前。
# 例：-tune film -profile:v high（会与 -i/-ss/-t/-to 冲突的保留参数会被忽略）
# 注：参数按空白切分；含空格的参数值用引号包成一个整体（如 -x265-params "a=b c=d"）。
# 引号语义与 shell 不同：不支持反斜杠转义、不做变量展开（同样适用于预设的 _extra_args/_args）。
ffmpeg_extra_args=
# 留空表示输出到原视频所在目录。
output_directory=
# 输出文件命名（片段可在「片段列表 → 重命名」里起名，名字会进入文件名；未命名时用序号+起止时间码）：
#   **下面所有默认名都会自动追加 _cut 防覆盖**（数字后缀如 _cut_1 表示同名已有文件）；
#   写了自己的命名模板时不再追加（见文末 output_name_template）。
#   逐段导出： <源名>_<序号>_<名字>_cut.mp4       例 my_video_002_take 1_cut.mp4
#             未命名时 <源名>_<序号>_<起><止>_cut.mp4（如 my_video_002_00h01m40s000-00h04m20s500_cut.mp4）
#   合并导出： <源名>_<名字1>+<名字2>+…_cut.mp4  例 my_video_开场+take 1+结尾_cut.mp4
#             名字太长/太多时以 "+N" 收尾（表示还有 N 段没进名字）；全都没命名时 <源名>_merged_<N>clips_cut.mp4
#   名字会做文件名安全化：Windows 非法字符→_、结尾点/空格去掉；
#   逐段导出每个名字截到 40 字符，合并导出的名字截到 20 字符，合并名总长上限 48 字符（超出用 "+N" 收尾）。
#   整片转码（无片段）：<源名>_cut.mp4。
# 命名模板（可选）：留空 = 用上面的默认规则；填写后**只接管"未命名片段"**（给片段起过名的仍用名字），
#   并且所有导出都不再追加 _cut 后缀（合并导出同样不带 _cut，但名字主体仍由片段名生成）。
#   占位符：{name} 源名、{index} 片段序号(3 位)、{in} / {out} 起止时间码；
#   未识别的占位符原样保留（拼错时一眼能看见）；解析结果为空时回退默认规则。
#   例：output_name_template = {name}_{index}   → my_video_002.mp4
#       output_name_template = {name}_{in}      → my_video_00h01m40s000.mp4
#   注意：Windows 非法字符会被替换成 _；模板结果按字符截到 120。
#   图片序列仍会追加 _%04d 帧序号（{name}_{index} → my_video_002_0001.png），单帧 / 拼图加 _frame / _sheet。
output_name_template=
encode_container=mp4
video_codec=libx264
audio_codec=aac
preset=fast
# crf、cq、global_quality、bitrate、none
video_quality_mode=crf
# CRF 越低质量越高、文件越大，libx264 常用 16 至 23。
video_quality=18
audio_bitrate=192k
# 字幕抽取（导出类型选「字幕」时生效）：srt / ass / webvtt / copy
# copy = 原样复制字幕流到 mkv（图形字幕如 PGS 只能用这个）
subtitle_codec=srt
# 图片导出模式（导出类型选「图片序列」时生效）：
#   sequence  = 按 animated_fps 逐帧抽图，输出一个图片序列
#   keyframes = 每个关键帧一张图（只解码关键帧，速度快）
#   tile      = 等间隔抽帧拼成一张总览图（tile_grid 指定网格边长，如 5x5 = 25 帧）
#   single    = 单帧：每个片段只取起始帧导出一张图
image_mode=sequence
tile_grid=5x5
# 关键帧模式（image_mode=keyframes）专用：
#   keyframe_stride = 每 N 个关键帧取一张（1 = 全取；纯滤镜实现，零额外开销）
#   keyframe_limit  = 总张数上限（0 = 不限制）。超过时会自动加大步长：
#                     导出前先异步数一遍关键帧总数（需要完整扫描一遍，结果按源文件缓存），
#                     再取 ceil(总数 / 上限) 作为步长，与 keyframe_stride 取较大者。
keyframe_stride=1
keyframe_limit=0
# ── 自动处理（确认面板里有对应开关；这里配置细节）──────────────────────────
# 三个开关都会在导出前异步探测源（结果按源文件缓存，失败只记警告并降级、不阻塞导出）：
#   auto_deinterlace  检测到隔行（field_order = tt/bb/tb/bt）就插入 bwdif（无则 yadif），要求重新编码
#   auto_crop_black   采样片头跑 cropdetect，取出现次数最多的矩形自动裁剪；要求重新编码，手动裁剪优先
#   normalize_audio   音量归一化（loudnorm 两遍：先测量再应用）。音频要重编码，视频可继续流复制；
#                     若 audio_codec=copy 会被自动改成 aac
auto_deinterlace=no
auto_crop_black=no
normalize_audio=no
# loudnorm 目标值（EBU R128：-16 LUFS / -1.5 dBTP / 11 LU 是常见的网络发布档）
loudness_target_i=-16
loudness_target_tp=-1.5
loudness_target_lra=11
# 黑边/响度分析最多采样多少秒（长片按此截断，避免为分析而全片扫描；0 = 不截断）
analysis_sample_seconds=600
# ── 去除静音段（导出前分析源，把标记片段里的静音区间挖掉；要求重新编码）───────────
# 开关在确认面板（「去除静音段」），以下三个是细节参数。
# 注意：静音分析**不受 analysis_sample_seconds 截断**（静音图必须覆盖整片，否则后面的
# 片段会被当成"全是正常声音"），只解码音频，长片按音频解码速度耗时，结果按源缓存。
remove_silence=no
# 静音判定阈值（dB）：低于它算静音。-30 适合口播，底噪大的录音可放宽到 -20
silence_db=-30
# 最短静音时长（秒）：短于此的停顿不算静音，避免把正常换气切碎
silence_min=0.5
# 静音两侧各保留多少秒：避免掐掉起音/尾音
silence_pad=0.1
# ── 智能无损切割（仅快速模式生效，确认面板里有开关）────────────────────────
# 快速模式的入点会被吸附到前一个关键帧（最多多出 1 个 GOP 的内容）。开启后改为：
#   [入点 → 下一个关键帧] 用与源一致的编码参数重编码这一小段（-crf 18；音频也要按源编码重编码）
#   [下一个关键帧 → 出点] 仍然流复制（无损）
#   两段用 concat 缝合
# 前提：源视频限 h264、像素格式限常见 8-bit、音频设置需与源编码一致（ac3/eac3 源用 audio_codec=copy）
# ——不满足会自动退回常规方式并提示原因。
smart_cut=yes
# 头部重编码段上限（秒）：入点到下一个关键帧超过它就放弃智能切割（源关键帧过疏）
smart_cut_max_head=15
# 注：合并导出（"合并为一个文件"）同样遵循快速复制/重新编码两种模式——快速复制逐段流复制再拼接，
# 秒级完成；重新编码才逐段重编码。需要"合并且入点精确"就开智能切割，或切到重新编码。
pixel_format=yuv420p
faststart=yes

# ---- 导出参数初始值（都是确认面板里可改的项）----
# 面板内改动即时生效但不写回 conf；这里设的值是每次打开确认面板时的起点。
# 输出尺寸与帧率：0 = 跟随源
video_width=0
video_height=0
output_fps=0
# 变速导出：1 = 原速，可填 0.25–4（如 0.5 / 2 / 1.5）。音频自动保持音调，
# 时长按倍速缩放（2 倍速 = 片段时长减半）。要求重新编码，快速复制下不生效。
play_speed=1
# 缩放模式：fit 等比缩放（按需留黑边）、pad 自动加黑边、stretch 拉伸变形。
scale_mode=fit
# 质量模式为 bitrate 时使用的目标码率（如 8M）；留空表示不使用该模式。
video_bitrate=
# 音频采样率与声道数：0 = 跟随源。
audio_sample_rate=0
audio_channels=0
# 动图导出（确认面板「动图」类型）的初始值：
# 格式 gif / webp / apng / avif；宽度 0 = 原尺寸；循环 0 = 无限。
animated_format=gif
animated_fps=12
animated_width=640
animated_loop=0
# 质量 0-100，数值越大质量越高（gif / apng 忽略此项）。
animated_quality=80
# 图片序列导出（确认面板「图片序列」类型）的初始值：
# 格式 png / jpg / webp / avif / jxl / tiff；质量 0-31，数值越小质量越高。
image_format=png
image_quality=2
# 图片宽度：0 = 保持原尺寸（最高质量，也是默认值）。设了具体像素才会缩放。
# 与动图的 animated_width 分开：改动图尺寸不该顺带缩掉图片导出。
image_width=0
# 逐帧序列的张数 = 选中时长 × animated_fps（动图那一项），长片段上这个数会长得很快；
# 建议用面板上的「当前帧」或「单帧」模式。

# 导出确认、进度与验证
export_confirmation=yes
show_export_progress=yes
# 进度读取间隔，单位为秒。
progress_interval=0.25
# off、basic（存在且非空）。旧的 strict（ffprobe 逐流检查）已移除：它按"源里选中的流"
# 要求产物，音频/动图/无音轨产物天然缺流会被误判，读到 strict 按 basic 处理并告警。
merge_validation=basic
cleanup_stale_tasks=yes
stale_task_days=7
# output 写入输出目录下的 .quickcut；off 不生成。
diagnostic_location=output

# 时间轴与片段
# 入点和出点标记的鼠标命中半径，单位为像素。
timeline_handle_hit_radius=10
# 时间轴两端吸附范围，单位为像素。
timeline_edge_snap=5
max_visible_segments=7
auto_sort_segments=yes
# strict 要求同时设置入点和出点；smart 可用视频首尾补全。
draft_mode=strict
# 最小片段时长：0 = 按帧（1/fps，默认，最精确）；>0 = 额外的人工下限（秒），
# 同时作为入点与出点防交叉间隔。
min_segment_duration=0

# 时间轴拖动
timeline_drag_seek_fps=20
timeline_drag_threshold=4
timeline_drag_pause=yes
timeline_drag_resume=yes

# ============================================================
# 主剪辑快捷键
# 多个按键用英文逗号分隔；留空表示禁用该动作。
# 同一上下文冲突时保留先定义的动作，并在日志中警告。
# ============================================================
key_pause=SPACE,KP5
key_set_in=[
key_set_out=]
key_add=ENTER,KP_ENTER
key_undo=z,Z
key_redo=y,Y
key_nudge_back=LEFT,KP4
key_nudge_forward=RIGHT,KP6
key_export=e,E
key_merge=m,M
# 直接以「动图」类型打开导出面板（跳过"打开面板 → 在类型行里选动图"这一步）。
# 默认留空 = 不占用任何键；想用时填一个不冲突的键，例如 key_export_animated=Shift+A。
key_export_animated=
key_clear=x,X
key_segments=l,L
key_split=s,S,KP_DIVIDE
key_delete=DEL,KP_DEC
# 片段选择导航：循环移动选中片段（滚动列表并跳转播放头）
key_segment_prev=UP
key_segment_next=DOWN
key_close=q,Q,ESC
# 直接输入片段时间码（对选中片段；格式 1:23.5 或 0:01:23.456，用 - 分隔起止）
key_edit_time=t,T
# 跳到指定时间码（精确标点用：跳过去后按 [ / ] 即入/出点）
key_seek_time=g,G
# 键位速查浮层（列出当前上下文的全部快捷键：主剪辑台 / 裁剪 / 导出确认面板）
# 在导出确认面板里同样可用：第一次 Esc 关浮层，第二次才关面板。
key_help=?,K
# ------------------------------------------------------------
# 剪辑模式下"额外放行"的按键（默认空 = 除脚本自己的绑定外，什么也不加）
# 背景：主剪辑台 / 裁剪 / 导出确认三个上下文都以 exclusive 方式启用输入 section ——
# 除脚本自身绑定外，mpv 原绑定与你 input.conf 里的绑定全都失效
# （SPACE/方向键/F1-F12/字母数字标点等还被显式写成 ignore 影子）。想保留少量 mpv
# 原生操作（最典型：滚轮调音量）只能在这里显式写。
#
# 写法（值只能是"一行"，conf 是行式配置，换行会把值截断）：
#   1) 可以写多条，用半角分号 ; 分隔；每条 = <按键> <mpv 命令>（input.conf 原生语法）
#   2) 按键：普通键 / 修饰键（Ctrl+SPACE、Alt+LEFT）/ 鼠标键（MBTN_LEFT、MBTN_MID、MBTN_BACK）
#      / 媒体键（PLAYPAUSE、VOLUME_UP…）
#   3) 命令：任意 mpv 命令，如 add volume 5 / cycle mute / cycle fullscreen / screenshot / run ...
#      注意不能直接写脚本内部的动作名（那是脚本自己的 key_* 绑定，不是 mpv 命令）
#   4) 整行以 # 开头会被忽略（当注释）；行尾也可按 input.conf 规则写行内 # 注释
#   5) 放行行排在 section 最后，**会覆盖脚本自身的同名绑定**（例如写 q cycle fullscreen 会顶掉
#      脚本的"关闭/退出"）；命中脚本绑定时会打印日志
#      "quick_cut extra_bindings overrides a script key: ..." 便于排查
#   6) 放行后三个上下文（主面板 / 裁剪 / 确认面板）都生效，没有"只对某个上下文生效"的粒度
#
# 例：滚轮调音量（对应 input.conf 的 WHEEL_UP/DOWN add volume）
# extra_bindings=WHEEL_UP add volume 5;WHEEL_DOWN add volume -5
# 例：中键静音 + 侧键换曲（中键单击无法连续调节音量，音量请用滚轮/按键）
# extra_bindings=MBTN_MID cycle mute;MBTN_BACK playlist-prev;MBTN_FORWARD playlist-next
# 例：全屏 + 截图（默认都被拦截，需要就显式放行）
# extra_bindings=F cycle fullscreen;s screenshot
extra_bindings=WHEEL_UP add volume 5;WHEEL_DOWN add volume -5
# 裁剪窗口 / 波形开关（key_crop 直接进裁剪编辑，已无独立菜单）
key_crop=c,C
key_wave=w,W
# 收起 / 展开主面板的按钮区（保留时间轴）：看片时减少遮挡，键位仍生效
key_panel=h,H
# 保存当前帧为图片：参数只取本文件（image_format / image_quality / image_width / 裁剪 /
# 输出目录 / 命名模板），**不受导出面板里改过的设置影响**——面板是给导出用的，按 F 存帧
# 是随手的单张，两套参数互不牵连。没有 ffmpeg 时自动退回 mpv 原生截图。
key_frame_save=f,F
# 把当前片段加入 / 移出播放范围（多选即依次连播）
# 注意：不能写 Shift+SPACE —— mpv 对单字符键会忽略 Shift，Shift+SPACE 与 SPACE 是同一个键，
# 会把上面的「播放/暂停」整条覆盖掉（表现为按空格变成移出播放范围）。用字母大小写最省事。
key_range_toggle=r,R
# 退出播放范围（恢复自由播放）。鼠标同义操作有三种：点时间轴空白、再点一次已选中的那个片段、
# 点画面区（面板与时间轴之外的任意位置）—— 后一种只在"有选中/勾选"时接管左键（此时左键不再播放/暂停，用 SPACE）。
key_deselect=Ctrl+SPACE
# 逐帧调整：无标记时逐帧跳转播放画面，有标记时逐帧微调标记
key_frame_back=Ctrl+LEFT
key_frame_fwd=Ctrl+RIGHT
# 导出确认面板（仅面板打开时生效）：激活焦点 / 下一个焦点 / 上一个焦点
# Tab 的焦点顺序把**参数行排在前面**（默认焦点在「开始」按钮上，一步就能到参数）。
key_activate=ENTER,KP_ENTER
key_focus_next=TAB
key_focus_prev=SHIFT+TAB
# 调整"当前聚焦参数"的值（焦点在参数行上时）。下拉浮层展开时改为在选项间移动高亮。
# 与主剪辑台的 ←/→（±1s seek）用同样的键，但确认面板是互斥输入上下文，不会互相影响。
key_param_prev=UP,KP8
key_param_next=DOWN,KP2
# 把"当前聚焦参数"恢复为预设值（等价于点该格右侧的 ⟲；下拉展开时＝取消本次修改）
key_param_reset=BS
# 关键帧对齐：跳到上/下一个关键帧（对活跃入/出点标记或播放头生效；索引由 ffprobe 惰性加载）
key_kf_prev=Alt+LEFT
key_kf_next=Alt+RIGHT

# 裁剪编辑快捷键
crop_key_pause=SPACE,KP0
crop_key_left=LEFT,KP4
crop_key_right=RIGHT,KP6
crop_key_up=UP,KP8
crop_key_down=DOWN,KP2
crop_key_left_fast=Shift+LEFT
crop_key_right_fast=Shift+RIGHT
crop_key_up_fast=Shift+UP
crop_key_down_fast=Shift+DOWN
crop_key_smaller=-,KP_SUBTRACT
crop_key_larger=+,=,KP_ADD
crop_key_smaller_fast=Ctrl+-
crop_key_larger_fast=Ctrl+=
crop_key_center=c,C,KP5
crop_key_hud=h,H
crop_key_help=?
# 裁剪编辑里也能撤销 / 重做（与主剪辑台同一条历史）
crop_key_undo=z,Z
crop_key_redo=y,Y
crop_key_done=ENTER,KP_ENTER
crop_key_cancel=q,Q,ESC

# OSC 与 uosc 接管
takeover_osc=yes
takeover_uosc=yes
flash_osc_on_restore=yes
uosc_takeover_elements=timeline,controls,volume,speed

# 会话持久化：按媒体路径记忆剪辑进度（退出/换片时保存，进入操作台时恢复）
resume_session=yes

# ---- 裁剪初始值（进入剪辑台时的起点；会话里保存的裁剪会覆盖这里）----
# 模式 none / aspect（按比例）/ custom（按下面的自定义框）。
crop_mode=none
# 比例模式使用：source（跟随源）/ 16:9 / 9:16 / 4:3 / 3:4 / 1:1 / 21:9。
crop_aspect=source
# 自定义框（crop_mode=custom 时生效），单位为源像素；0 表示不约束。
crop_x=0
crop_y=0
crop_width=0
crop_height=0

# 裁剪预览
# 编辑时低遮罩，便于观察原画面上下文。
crop_edit_mask_alpha=0.14
# 普通剪辑时高遮罩，突出最终保留区域。
crop_preview_mask_alpha=0.72
# 当前正式支持 corners。
crop_preview_style=corners
show_crop_frame=yes
crop_frame_width=2
crop_move_step=8
crop_move_step_fast=64
crop_resize_step=16
crop_resize_step_fast=128

# UI 外观（内置常量，不支持自定义主题）
#   令牌 = 脚本内置的默认值；图标来自随脚本分发的图标字体，字体缺失时自动回退纯文本（详见 docs/faq.md）。
#   下面这些 ui_* 选项可在 conf 里覆盖对应令牌；conf 只在启动时读一次，改完重启 mpv。
#   本节下列令牌即**内置默认值**：带 ui_ 前缀的可在 conf 覆盖，其余仅作说明。
#   以下令牌的 conf 入口：
#     ui_timeline_ruler（时间轴时间刻度 0/1）、ui_timeline_boundaries（时间轴下方的片段边界时间码 0/1）、ui_alpha_segment（片段填充不透明度）、ui_layout_card_edge（卡片距屏幕边的统一间距）、ui_layout_selected_border、ui_color_pending / ui_alpha_pending（未确认截取范围与入/出点标记的橙色）、ui_radius_tooltip、
#     ui_alpha_hint / ui_alpha_job_card / ui_card_match_panel / ui_card_alpha_floor、
#     ui_button_height / ui_font_button / ui_layout_icon_ratio（工具栏按钮的高/字号/图标比例）、
#     ui_hint_compact / ui_hint_icon / ui_job_card_max_width / ui_job_card_height、
#     ui_alpha_group_bg / ui_alpha_group_divider、ui_layout_card_shadow_ratio / ui_layout_card_row_gap、
#     ui_layout_hint_font_ratio / ui_layout_hint_zone_gap / ui_layout_hint_max_ratio /
#     ui_layout_hint_row_ratio / ui_layout_hint_icon_ratio / ui_layout_hint_pad_x / ui_layout_hint_pad_y、
#     ui_layout_timeline_collapsed_margin_x / _bottom、ui_color_segment_divider / ui_alpha_segment_divider /
#     ui_layout_segment_divider_w / ui_layout_segment_inset_y / ui_color_panel_highlight /
#     ui_alpha_panel_highlight / ui_alpha_card_outline。
#   ui_layout_panel_icon / ui_layout_viewport_min_fit / ui_layout_narrow_floor 这三项没有 conf 入口，只能改代码。
# 模态面板（片段列表/导出/键位速查）背后的暗幕强度，auto 跟随令牌 alpha_curtain
curtain_alpha=auto
# 菜单浮层（裁剪/目录/参数下拉）的背景透明度，auto 跟随令牌 alpha_menu
menu_alpha=auto
# 菜单浮层圆角，auto 跟随令牌 radius_menu
menu_radius=auto
# 界面语言：auto 按 mpv 的 osd-lang 自动选择（默认派生自系统 locale，可在 mpv.conf 覆盖）；
# 也可直接指定如 zh_CN、en_US。
# 指定的语言包不存在时自动回落到英文（en_US）。
ui_language=auto
# 时间轴背景显示音频波形（进入剪辑台后台用 showwavespic 生成，每源文件缓存一次）。
# 波形在片段区间内以片段色高亮。生成失败时静默降级（仅记日志）。
waveform=no
# 播放范围由「选择」驱动（已无预览 / 连播开关）：
#   勾选片段（片段列表行首勾选格，或 R）→ 1 段时 A-B 循环、≥2 段依次连播；
#   未勾选任何片段时，范围 = 当前聚焦的那一段；点时间轴空白或 Ctrl+SPACE 退出范围。
# UI 风格预设
# comfortable（默认）= 跟随内置令牌的尺寸（ui.lua 的 DEFAULT_TOKENS 里的几何与字号）；
# compact / ultra_compact = 显式压紧，**会覆盖**这些令牌的几何与字号，适合小窗口/多任务。
# 优先级：conf 里单独写的项 > 显式预设 > 内置默认。
# 想完全手动控制：ui_preset=custom，再逐项赋值。
# 无论选择哪种预设，播放器窗口变化都只影响横向可用空间。
ui_preset=comfortable

# 统一 UI 令牌
# 留空或 auto 表示使用内置默认值；填写具体值表示覆盖该令牌。
ui_color_panel=
ui_color_text=
ui_color_text_inverse=
ui_color_primary=
ui_color_selection=
ui_color_warning=
ui_color_success=
ui_color_danger=
ui_color_timeline=
ui_color_segment=
ui_color_segment_disabled=
ui_color_playhead=
ui_alpha_panel=auto
ui_alpha_button_idle=auto
ui_alpha_button_hover=auto
ui_alpha_button_active=auto
# 置灰（不可用）按钮怎么表达：只压暗在深色面板上容易被读成"暗一点的可用项"，
# 所以默认再加一条删除线。可选 strike（默认）/ slash（斜杠）/ strike_slash（两者）/ dim（只压暗）。
ui_button_disabled_style=strike
# 置灰文字的透明度，默认 0.42（越小越淡）
ui_alpha_button_disabled=auto
# 删除线 / 斜杠的线宽，默认 2
ui_layout_button_disabled_strike=auto
ui_alpha_timeline=auto
ui_radius_button=auto
ui_radius_panel=auto
ui_radius_timeline=auto
# 以下几何令牌同样可覆盖（默认 auto = 用内置值）；列在此处是为了让 conf 里能搜到名字，
# 完整清单见上方「统一 UI 令牌」说明块。
ui_button_width=auto
ui_button_height=auto
ui_font_button=auto
ui_layout_icon_ratio=auto
ui_status_button_width=auto
ui_panel_padding_x=auto
ui_panel_padding_y=auto
ui_button_timeline_gap=auto
ui_timeline_inset=auto
ui_playhead_diamond_size=auto

# 整体 UI 固定尺寸
# 播放器窗口变化只影响按钮面板的横向宽度与间距，不改变字号、按钮高度和时间轴高度。
# 普通窗口与全屏可分别设置；相同数值表示两种模式保持相同视觉尺寸。
# 推荐：0.90 较小、1.00 标准、1.10 稍大、1.20 较大。
scale=1.50
scale_fullscreen=1.50
font=auto
font_bold=yes
# 字号 / 高度 / 间距由上面的 ui_preset 决定，默认整组注释掉（comfortable 档即如此）。
# 想自己固定某一项：取消注释并改成目标值——**值恰好等于内置默认的写法无效**，
# 脚本只能靠"值是否等于默认"判断你有没有显式设置过。
# 下面给的是 comfortable 档的参考值。
# button_font_size=16
# tooltip_font_size=14
# menu_font_size=15
# menu_title_font_size=18
# timeline_height=32
# button_height=42
# button_gap=6
# button_group_gap=12
# controls_margin_x=14
# tooltip_gap=7

# 紧凑任务面板
# job_card_width=230
# job_card_height=

# 操作提示
action_hint_duration=1.25
action_hint_long_duration=2.0
# 提示字号（设计像素，会乘界面缩放）。注意它受 layout_hint_font_ratio 封顶：
# 上限 = 生效的按钮字号 × layout_hint_font_ratio（默认 1.05），超出会被压到上限并在日志里告警一次。
action_hint_font_size=12
action_hint_max_width=720
action_hint_line_gap=5
